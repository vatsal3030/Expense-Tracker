apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare-client
  namespace: fairshare
  labels:
    app: fairshare-client
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fairshare-client
  template:
    metadata:
      labels:
        app: fairshare-client
        tier: frontend
    spec:
      containers:
        - name: client
          image: vatsal3030/fairshare-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: fairshare-config
            - secretRef:
                name: fairshare-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fairshare-client-svc
  namespace: fairshare
  labels:
    app: fairshare-client
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: fairshare-client
