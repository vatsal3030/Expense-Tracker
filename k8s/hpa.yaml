apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fairshare-server-hpa
  namespace: fairshare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fairshare-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fairshare-client-hpa
  namespace: fairshare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fairshare-client
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
