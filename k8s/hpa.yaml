apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fairshare-identity-hpa
  namespace: fairshare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fairshare-identity
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
