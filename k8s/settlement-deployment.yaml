apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare-settlement
  namespace: fairshare
  labels:
    app: fairshare-settlement
    tier: microservice
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fairshare-settlement
  template:
    metadata:
      labels:
        app: fairshare-settlement
        tier: microservice
    spec:
      containers:
        - name: settlement-service
          image: vatsal3030/fairshare-server:latest
          command: ["node", "--max-old-space-size=128", "dist/services/settlement.service.js"]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
              name: http
          env:
            - name: PORT
              value: "5003"
          envFrom:
            - configMapRef:
                name: fairshare-config
            - secretRef:
                name: fairshare-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fairshare-settlement-svc
  namespace: fairshare
  labels:
    app: fairshare-settlement
spec:
  type: ClusterIP
  ports:
    - port: 5003
      targetPort: 5003
      protocol: TCP
      name: http
  selector:
    app: fairshare-settlement
