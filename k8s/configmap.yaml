apiVersion: v1
kind: ConfigMap
metadata:
  name: fairshare-config
  namespace: fairshare
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_PORT: "3000"
  CLIENT_URL: "https://fairshare.local"
  NEXT_PUBLIC_API_URL: "https://fairshare.local/api"
---
apiVersion: v1
kind: Secret
metadata:
  name: fairshare-secrets
  namespace: fairshare
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:<your-db-password>@<your-db-host>:5432/postgres?sslmode=require"
  DIRECT_URL: "postgresql://postgres:<your-db-password>@<your-db-host>:5432/postgres"
  SUPABASE_URL: "https://<your-project-id>.supabase.co"
  SUPABASE_ANON_KEY: "<your-supabase-anon-key>"
  SUPABASE_SERVICE_ROLE_KEY: "<your-supabase-service-role-key>"
  JWT_SECRET: "<your-jwt-secret-min-32-chars>"
