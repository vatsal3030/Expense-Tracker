apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare-server
  namespace: fairshare
  labels:
    app: fairshare-server
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fairshare-server
  template:
    metadata:
      labels:
        app: fairshare-server
        tier: backend
    spec:
      containers:
        - name: server
          image: vatsal3030/fairshare-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: fairshare-config
            - secretRef:
                name: fairshare-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fairshare-server-svc
  namespace: fairshare
  labels:
    app: fairshare-server
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: fairshare-server
