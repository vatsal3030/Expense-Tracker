version: '3.8'

services:
  # ===========================================================================
  # NGINX API GATEWAY & REVERSE PROXY
  # Routes port 80 traffic: /api/* -> server:5000, /* -> client:3000
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: fairshare-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - fairshare-network

  # ===========================================================================
  # BACKEND MICROSERVICE (Express API)
  # ===========================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fairshare-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=*
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:5000/api/health',s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fairshare-network

  # ===========================================================================
  # FRONTEND MICROSERVICE (Next.js Standalone)
  # ===========================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://eqtmygiizyehikodaxpe.supabase.co}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_YJzGFp2HW1qjOrnjGO618g_2CXVUTr3}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    container_name: fairshare-client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - fairshare-network

networks:
  fairshare-network:
    driver: bridge
