version: '3.8'

services:
  # ===========================================================================
  # NGINX API GATEWAY & REVERSE PROXY
  # Routes port 80 traffic:
  #   - /api/auth, /api/users, /api/friends              -> identity-service:5001
  #   - /api/groups, /api/expenses, /api/budgets, /api/recurring, /api/fx -> expense-service:5002
  #   - /api/settlements, /api/dashboard, /api/export    -> settlement-service:5003
  #   - /api/notifications, /api/activities, /api/admin, /socket.io -> notification-service:5004
  #   - /*                                                -> client:3000
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: fairshare-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - identity-service
      - expense-service
      - settlement-service
      - notification-service
    networks:
      - fairshare-network

  # ===========================================================================
  # REDIS IN-MEMORY DISTRIBUTED STORE (100% Free on AWS EC2)
  # ===========================================================================
  redis:
    image: redis:alpine
    container_name: fairshare-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - fairshare-network

  # ===========================================================================
  # MICROSERVICE 1: IDENTITY & SOCIAL SERVICE (Port 5001)
  # ===========================================================================
  identity-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fairshare-identity-service
    restart: unless-stopped
    command: ["node", "--max-old-space-size=128", "dist/services/identity.service.js"]
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CLIENT_URL=*
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in environment}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL must be set in environment}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL must be set in environment}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set in environment}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set in environment}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in environment}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:5001/health',s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fairshare-network

  # ===========================================================================
  # MICROSERVICE 2: EXPENSE & CORE DOMAIN SERVICE (Port 5002)
  # ===========================================================================
  expense-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fairshare-expense-service
    restart: unless-stopped
    command: ["node", "--max-old-space-size=128", "dist/services/expense.service.js"]
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - PORT=5002
      - CLIENT_URL=*
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in environment}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL must be set in environment}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL must be set in environment}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set in environment}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set in environment}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in environment}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:5002/health',s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fairshare-network

  # ===========================================================================
  # MICROSERVICE 3: SETTLEMENT & OPTIMIZATION GRAPH ENGINE (Port 5003)
  # ===========================================================================
  settlement-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fairshare-settlement-service
    restart: unless-stopped
    command: ["node", "--max-old-space-size=128", "dist/services/settlement.service.js"]
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - PORT=5003
      - CLIENT_URL=*
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in environment}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL must be set in environment}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL must be set in environment}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set in environment}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set in environment}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in environment}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:5003/health',s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fairshare-network

  # ===========================================================================
  # MICROSERVICE 4: REAL-TIME & NOTIFICATION SERVICE (Port 5004)
  # ===========================================================================
  notification-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fairshare-notification-service
    restart: unless-stopped
    command: ["node", "--max-old-space-size=128", "dist/services/notification.service.js"]
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - PORT=5004
      - CLIENT_URL=*
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in environment}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL must be set in environment}
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL must be set in environment}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set in environment}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set in environment}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in environment}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:5004/health',s=>{process.exit(s.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fairshare-network

  # ===========================================================================
  # FRONTEND CLIENT (Next.js Standalone Port 3000)
  # ===========================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY must be set}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    container_name: fairshare-client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - identity-service
      - expense-service
      - settlement-service
      - notification-service
    networks:
      - fairshare-network

networks:
  fairshare-network:
    driver: bridge
