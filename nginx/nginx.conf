events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================================
    # MICROSERVICES UPSTREAM DEFINITIONS
    # =========================================================================
    upstream client_service {
        server client:3000;
    }

    upstream identity_service {
        server identity-service:5001;
    }

    upstream expense_service {
        server expense-service:5002;
    }

    upstream settlement_service {
        server settlement-service:5003;
    }

    upstream notification_service {
        server notification-service:5004;
    }

    server {
        listen 80;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/16.192.15.202.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/16.192.15.202.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 25M;

        # ---------------------------------------------------------------------
        # Gateway & Health Check Endpoints
        # ---------------------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        location = /api/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx-api-gateway","architecture":"microservices","services":["identity-service:5001","expense-service:5002","settlement-service:5003","notification-service:5004"]}';
        }

        # ---------------------------------------------------------------------
        # 1. Identity & Social Service (Port 5001)
        # ---------------------------------------------------------------------
        location /api/auth {
            proxy_pass http://identity_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/users {
            proxy_pass http://identity_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/friends {
            proxy_pass http://identity_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        # ---------------------------------------------------------------------
        # 2. Expense & Core Domain Service (Port 5002)
        # ---------------------------------------------------------------------
        location /api/groups {
            proxy_pass http://expense_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/expenses {
            proxy_pass http://expense_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/budgets {
            proxy_pass http://expense_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/recurring {
            proxy_pass http://expense_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/fx {
            proxy_pass http://expense_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        # ---------------------------------------------------------------------
        # 3. Settlement & Optimization Graph Engine (Port 5003)
        # ---------------------------------------------------------------------
        location /api/settlements {
            proxy_pass http://settlement_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/dashboard {
            proxy_pass http://settlement_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/export {
            proxy_pass http://settlement_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        # ---------------------------------------------------------------------
        # 4. Real-time & Notification Service (Port 5004)
        # ---------------------------------------------------------------------
        location /api/notifications {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/activities {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        location /api/admin {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 90s;
        }

        # Socket.io Real-time WebSocket Proxy
        location /socket.io/ {
            proxy_pass http://notification_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /ws {
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---------------------------------------------------------------------
        # Gateway API Catch-all (Protects against silent fallthrough to frontend)
        # ---------------------------------------------------------------------
        location = /api {
            default_type application/json;
            return 404 '{"error":"Not Found","message":"API route not found on gateway"}';
        }

        location /api/ {
            default_type application/json;
            return 404 '{"error":"Not Found","message":"API route not found on gateway"}';
        }

        # ---------------------------------------------------------------------
        # 5. Next.js Frontend Client (Port 3000)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://client_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
